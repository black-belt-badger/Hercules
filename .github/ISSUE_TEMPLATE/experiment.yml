name: Experiment proposal
description: Propose a falsifiable API, performance or mathematical experiment.
title: "[Experiment] "
labels: [experiment]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline and method
      description: Define a reproducible comparison with ordinary Java alternatives.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success and failure criteria
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Law tests, benchmarks, design note, prototype or a keep/defer/drop decision.
