name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify Java 17-compatible library
        run: ./mvnw -B -ntp verify
      - name: Prove JSpecify contracts fail compilation when violated
        run: ./scripts/verify-nullness.sh
      - name: Verify consumer dependency scopes and thin JAR
        run: ./scripts/verify-consumer-deps.sh
